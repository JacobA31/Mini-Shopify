# Build + test on every push and pull request; deploy to Azure on every push to main.
#
#   build ──────┐
#     └─ e2e ───┼─ deploy ── smoke
#   js-unit ────┘
#
# - build:   Java tests (unit, controller, integration, and Selenium browser tests) + the JAR
# - js-unit: Jasmine tests for the page scripts in src/main/resources/static/js
# - e2e:     Playwright tests in e2e/ against the JAR from build, in Chromium, Firefox, and WebKit
# - deploy:  only if all three pass
# - smoke:   the read-only tests in e2e/smoke against the live app on Azure
#
# The deploy job is skipped until the Azure setup in CONTRIBUTING.md ("One-time setup") is done:
#   - repository variable  AZURE_WEBAPP_NAME             (Settings > Secrets and variables > Actions > Variables)
#   - repository secret    AZURE_WEBAPP_PUBLISH_PROFILE  (Settings > Secrets and variables > Actions > Secrets)
# Optional: repository variable AZURE_WEBAPP_URL (e.g. https://<app>.azurewebsites.net) for the smoke tests.
# Without it they use the URL the deploy step reports.

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and run tests
        run: ./mvnw -B -ntp verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: target/surefire-reports/

      # Used by the e2e job (also on pull requests) and by the deploy job
      - name: Upload JAR
        uses: actions/upload-artifact@v7
        with:
          name: app-jar
          path: target/mini-shopify.jar
          retention-days: 7

  js-unit:
    name: JavaScript unit tests (Jasmine)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Jasmine
        run: npm run test:js

  e2e:
    name: End-to-end tests (Playwright)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Download JAR
        uses: actions/download-artifact@v8
        with:
          name: app-jar
          path: target

      - name: Install dependencies
        run: npm ci

      - name: Install browsers
        run: npx playwright install --with-deps

      # Playwright starts the JAR itself (see webServer in playwright.config.ts)
      - name: Run Playwright
        run: npm run test:e2e

      # HTML report with a trace for every retried test: download it from the run's Summary page,
      # unzip, and run `npx playwright show-report <folder>`
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  deploy:
    name: Deploy to Azure
    needs: [build, js-unit, e2e]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.AZURE_WEBAPP_NAME != ''
    runs-on: ubuntu-latest
    # Shows up under "Deployments" on the repo page, which gives a record of deploy frequency.
    environment:
      name: production
      url: ${{ steps.deploy.outputs.webapp-url }}
    concurrency:
      group: production
      cancel-in-progress: false
    outputs:
      url: ${{ steps.deploy.outputs.webapp-url }}
    steps:
      - name: Download JAR
        uses: actions/download-artifact@v8
        with:
          name: app-jar

      - name: Deploy to Azure App Service
        id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: mini-shopify.jar

  smoke:
    name: Smoke tests on Azure
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE_URL: ${{ vars.AZURE_WEBAPP_URL || needs.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # The app restarts after a deploy and can take a minute or more to answer
      - name: Wait for the app to start
        run: |
          health="${BASE_URL%/}/actuator/health"
          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 20 "$health" | grep -q '"UP"'; then
              echo "App is up after $attempt attempt(s)"
              exit 0
            fi
            echo "Attempt $attempt: not up yet, retrying in 10 s"
            sleep 10
          done
          echo "::error::$health did not report UP within about 5 minutes"
          exit 1

      - name: Run smoke tests
        run: npm run test:smoke

      - name: Upload smoke test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-smoke-report
          path: playwright-report/
          retention-days: 7
