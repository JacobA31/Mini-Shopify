<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('Shop details')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main class="container">
    <h1>Shop details</h1>

    <p class="flash flash-success" th:if="${shopSaved}">Changes saved.</p>

    <h2 th:text="${shopDetails.name}">Shop name</h2>

    <p th:if="${!#strings.isEmpty(shopDetails.description)}" th:text="${shopDetails.description}"></p>
    <p th:if="${#strings.isEmpty(shopDetails.description)}">No description.</p>

    <section aria-labelledby="shop-tags-heading">
        <h3 id="shop-tags-heading">Tags</h3>
        <ul th:if="${!#lists.isEmpty(shopDetails.tags)}">
            <li th:each="tag : ${shopDetails.tags}" th:text="${tag}">tag</li>
        </ul>
        <p th:if="${#lists.isEmpty(shopDetails.tags)}">No tags.</p>
    </section>

    <a th:href="@{/shops/{id}/edit(id=${shopId})}">Edit shop details</a>

    <a th:href="@{/shops/{id}/products/new(id=${shopId})}">Add products to this shop</a>

    <a th:href="@{/shops/{id}/products(id=${shopId})}">View products</a>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
