<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('Edit product')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main class="container product-form-page">
    <h1>Edit product</h1>
    <p>In <strong th:text="${shop.name}">Shop name</strong></p>

    <form th:action="@{/shops/{shopId}/products/{productId}/edit(shopId=${shop.id},productId=${productId})}"
          th:object="${productForm}" method="post" enctype="multipart/form-data" id="product-form">
        <div class="form-field">
            <label for="name">Product name</label>
            <input type="text" th:field="*{name}" required>
            <p class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>
        </div>

        <div class="form-field">
            <label for="description">Description</label>
            <textarea th:field="*{description}" rows="4"></textarea>
            <p class="field-error" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></p>
        </div>

        <div class="form-field">
            <label for="price">Price</label>
            <input type="number" th:field="*{price}" step="0.01" min="0.01" required>
            <p class="field-error" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></p>
        </div>

        <div class="form-field">
            <label for="inventory">Inventory</label>
            <input type="number" th:field="*{inventory}" step="1" min="0" required>
            <p class="field-error" th:if="${#fields.hasErrors('inventory')}" th:errors="*{inventory}"></p>
        </div>

        <div class="form-field">
            <div th:if="${hasImage}" id="current-image">
                <p>Current image:</p>
                <div class="image-preview">
                    <img th:src="@{/shops/{shopId}/products/{productId}/image(shopId=${shop.id},productId=${productId})}"
                         th:alt="${productForm.name}"
                         width="120">
                    <button type="button" class="remove-image-button" id="remove-image-button"
                            aria-label="Remove image">&times;</button>
                </div>
            </div>
            <p th:if="${hasImage}" id="image-removed-message" class="field-help" hidden>
                The image will be removed when you save.
                <button type="button" class="link-button" id="undo-remove-image">Undo</button>
            </p>
            <!-- Set to "true" by the × button (see product-form.js) -->
            <input type="hidden" id="remove-image" name="removeImage" th:value="${productForm.removeImage}">
            <label for="image" th:text="${hasImage} ? 'Replace image (optional)' : 'Image (optional)'">Image (optional)</label>
            <input type="file" id="image" name="image" accept="image/jpeg,image/png,image/gif,image/webp">
            <p class="field-help">
                JPEG, PNG, GIF or WebP, up to 2 MB.
                <span th:if="${hasImage}">Leave empty to keep the current image.</span>
            </p>
            <p class="field-error" th:if="${#fields.hasErrors('image')}" th:errors="*{image}"></p>
        </div>

        <button type="submit">Save changes</button>
    </form>

    <p><a th:href="@{/shops/{id}/products(id=${shop.id})}">Cancel</a></p>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<script th:src="@{/js/product-form.js}" defer></script>
</body>
</html>
