<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('Order confirmed')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main class="container">
    <h1>Order confirmed</h1>
    <p>Thank you. Your simulated order has been placed.</p>
    <p><strong>Order number:</strong> <span th:text="${order.id}">1</span></p>

    <table class="cart-table">
        <thead>
        <tr>
            <th scope="col">Product</th>
            <th scope="col">Price</th>
            <th scope="col">Quantity</th>
            <th scope="col">Subtotal</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="line : ${order.lines}">
            <td th:text="${line.product.name}">Product</td>
            <td th:text="'$' + ${#numbers.formatDecimal(line.unitPrice, 1, 'COMMA', 2, 'POINT')}">$0.00</td>
            <td th:text="${line.quantity}">1</td>
            <td th:text="'$' + ${#numbers.formatDecimal(line.lineTotal, 1, 'COMMA', 2, 'POINT')}">$0.00</td>
        </tr>
        </tbody>
        <tfoot>
        <tr>
            <th scope="row" colspan="3">Total</th>
            <td class="cart-total"
                th:text="'$' + ${#numbers.formatDecimal(order.total, 1, 'COMMA', 2, 'POINT')}">$0.00</td>
        </tr>
        </tfoot>
    </table>

    <p><a th:href="@{/}">Continue shopping</a></p>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
