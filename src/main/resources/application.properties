spring.application.name=mini-shopify

# --- Database -------------------------------------------------------------------
# Locally and in tests: in-memory H2, so all data is lost when the app stops.
# On Azure, the "azure" profile (application-azure.properties) switches to an H2 file
# on the persistent /home disk instead.
spring.datasource.url=jdbc:h2:mem:minishopify
# The schema is created and changed by the Flyway migrations in
# src/main/resources/db/migration, never by Hibernate. Hibernate only checks that the
# @Entity classes match the tables and refuses to start if they don't.
# Changed an entity? Add a new migration (see CONTRIBUTING.md, "Changing the database schema").
spring.jpa.hibernate.ddl-auto=validate
# Don't keep the DB session open while rendering views; load what a page needs in the service.
spring.jpa.open-in-view=false
# Set to true locally to see the SQL that Hibernate generates (useful for the exam!).
spring.jpa.show-sql=false

# The H2 web console (http://localhost:8080/h2-console, JDBC URL above, user "sa", empty
# password) is enabled automatically by DevTools when running locally. DevTools is not
# included in the packaged JAR, so the console is never exposed on Azure.

# --- Ops ------------------------------------------------------------------------
# /actuator/health is used as the Azure App Service health check.
management.endpoints.web.exposure.include=health

# Product images: hard limit for an upload (the 2 MB image rule is checked in ProductForm)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
