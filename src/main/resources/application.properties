spring.application.name=mini-shopify

# --- Database -------------------------------------------------------------------
# In-memory H2: the schema is generated by Hibernate from the @Entity classes and
# all data is lost when the app restarts (including every Azure deploy).
# See docs/architecture.md ("Open decisions") before switching to a persistent DB.
spring.datasource.url=jdbc:h2:mem:minishopify
spring.jpa.hibernate.ddl-auto=create-drop
# Don't keep the DB session open while rendering views; load what a page needs in the service.
spring.jpa.open-in-view=false
# Set to true locally to see the SQL that Hibernate generates (useful for the exam!).
spring.jpa.show-sql=false

# The H2 web console (http://localhost:8080/h2-console, JDBC URL above, user "sa", empty
# password) is enabled automatically by DevTools when running locally. DevTools is not
# included in the packaged JAR, so the console is never exposed on Azure.

# --- Ops ------------------------------------------------------------------------
# /actuator/health is used as the Azure App Service health check.
management.endpoints.web.exposure.include=health
