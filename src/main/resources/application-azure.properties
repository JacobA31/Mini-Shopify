# Settings for the live app on Azure App Service. Loaded on top of application.properties
# when the App Service setting SPRING_PROFILES_ACTIVE=azure is set.

# --- Database -------------------------------------------------------------------
# An H2 database file on App Service's /home disk, which is kept across restarts and
# redeploys (unlike the rest of the container's file system). H2 creates the folder
# the first time the app starts, and Flyway creates the tables.
# User "sa" with no password: the file is only reachable by the app itself (no H2 server
# is started, and the H2 console is not part of the deployed JAR).
spring.datasource.url=jdbc:h2:file:/home/data/minishopify
